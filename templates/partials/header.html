{@io.quarkiverse.roq.frontmatter.runtime.model.Site site}
<header class="site-header">
  <div class="container bar">
    <a class="brand" href="{=site.url}">
      <img class="logo-light" src="{=site.url('images/logo.webp')}" alt="Melbourne Java &amp; JVM Users Group" width="600" height="338">
      <img class="logo-dark" src="{=site.url('images/logo-dark.webp')}" alt="Melbourne Java &amp; JVM Users Group" width="600" height="338">
      <span class="brand-name" aria-hidden="true">Melbourne Java &amp; JVM Users Group</span>
    </a>
    <input type="checkbox" id="nav-toggle" class="nav-toggle-input" aria-label="Toggle menu">
    <label for="nav-toggle" class="nav-toggle"><span></span></label>
    <nav class="site-nav" aria-label="Main navigation">
      <ul>
        <li><a href="{=site.url}">Home</a></li>
        <li><a href="{=site.url('about')}">About</a></li>
        <li><a href="{=site.url('events')}">Events</a></li>
        <li><a href="{=site.url('gallery')}">Gallery</a></li>
        <li><a href="{=site.url('contact')}">Contact</a></li>
        <li><a href="{=site.url('sponsors')}">Sponsors</a></li>
        <li><a href="{=site.url('code-of-conduct')}">Code of Conduct</a></li>
      </ul>
    </nav>
  </div>
</header>
