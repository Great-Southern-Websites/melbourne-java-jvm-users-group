    - generic [ref=e48]:
      - paragraph [ref=e50]: 01What to expect
      - generic [ref=e51]:
        - generic [ref=e52]:
          - heading "Some pizza, a talk and a room full of people who work with the JVM" [level=2] [ref=e53]
          - paragraph [ref=e54]: Each meetup starts with pizza, and time to chat with the speaker and the other people in the room. The talk follows, on Java or something else that runs on the JVM.
          - paragraph [ref=e55]: The group is free to join and free to attend. You do not need to be an expert, and you do not need to be working in Java right now. Students and people who are simply curious about the JVM are as welcome as developers who use it every day.
          - paragraph [ref=e56]:
            - link "More about the group" [ref=e57] [cursor=pointer]:
              - /url: /about
        - 'img "Melbourne Java & JVM Users Group mascot: Duke in a footy guernsey, holding a football" [ref=e59]'
    - generic [ref=e61]:
      - paragraph [ref=e63]: 02Next meetup
      - generic [ref=e64]:
        - generic [ref=e65]:
          - heading "Dates, talks and venues are announced on Meetup" [level=2] [ref=e66]
          - paragraph [ref=e67]: We meet four times a year in Melbourne CBD. The date, the venue and the talk for each meetup are posted on our Meetup page, and that is also where you RSVP. Joining the group there means you hear about each meetup as soon as it is announced.
          - link "See upcoming events on Meetup" [ref=e69] [cursor=pointer]:
            - /url: https://www.meetup.com/melbourne-java-jvm-users-group/
        - generic [ref=e71]:
          - paragraph [ref=e72]: Want to give a talk or help out?
          - paragraph [ref=e73]:
            - text: If you have a talk in you, or your company could host a meetup or help with the pizza, we would like to hear from you. Use the
            - link "contact page" [ref=e74] [cursor=pointer]:
              - /url: /contact
            - text: and we will get back to you.
